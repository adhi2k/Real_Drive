<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>RealDrive • Phone Motion Controller & AI Tracks</title>
	<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
	<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
	<style>
		body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
		canvas { display: block; touch-action: none; }
		.corner-link {
			position: absolute;
			color: #f0f4f8;
			font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			text-decoration: none;
			background: rgba(14, 20, 32, 0.85);
			padding: 8px 16px;
			border-radius: 999px;
			border: 1px solid rgba(255,255,255,0.12);
			box-shadow: 0 4px 14px rgba(0,0,0,0.3);
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			z-index: 40;
			transition: all 0.2s ease;
		}
		.corner-link:hover {
			background: rgba(255,255,255,0.18);
			border-color: rgba(0, 247, 255, 0.4);
			color: #00f7ff;
		}
		#editor-link { bottom: 16px; left: 16px; }
		#github-link { bottom: 16px; right: 16px; padding: 8px; line-height: 0; }
		#github-link svg { display: block; width: 18px; height: 18px; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
			"crashcat": "https://esm.sh/crashcat@0.0.3"
		}
	}
	</script>
</head>
<body>
	<a id="editor-link" class="corner-link" href="editor.html">✏️ Custom Track Editor</a>
	<script>
		const map = new URLSearchParams( location.search ).get( 'map' );
		if ( map ) {
			const link = document.getElementById( 'editor-link' );
			link.href = 'editor.html?map=' + map;
			link.textContent = '✏️ Edit in Editor';
		}
	</script>
	<script type="module" src="js/main.js?v=20260817"></script>
</body>
</html>
