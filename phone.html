<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>RealDrive • Mobile Motion Controller</title>
	<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
	<style>
		* {
			box-sizing: border-box;
			user-select: none;
			-webkit-user-select: none;
			margin: 0;
			padding: 0;
			touch-action: manipulation;
		}
		body {
			background: #090d16;
			color: #f0f4f8;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			position: fixed;
		}

		/* Orientation Warning for Portrait Mode */
		#portrait-warning {
			position: fixed;
			inset: 0;
			background: #0b1120;
			z-index: 999;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 30px;
			transition: opacity 0.3s ease;
		}
		@media (orientation: landscape) {
			#portrait-warning { display: none !important; }
		}
		.rotate-icon {
			font-size: 50px;
			margin-bottom: 16px;
			animation: rotateDevice 2s infinite ease-in-out;
		}
		@keyframes rotateDevice {
			0%, 100% { transform: rotate(0deg); }
			50% { transform: rotate(90deg); }
		}

		/* Start / Connect Modal Overlay */
		#permission-overlay {
			position: fixed;
			inset: 0;
			background: rgba(9, 13, 22, 0.96);
			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
			z-index: 1000;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 20px;
			text-align: center;
		}
		.start-card {
			width: 380px;
			max-width: 90vw;
			background: #0f172a;
			border: 1px solid rgba(0, 247, 255, 0.3);
			border-radius: 20px;
			padding: 22px;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 247, 255, 0.15);
		}
		.input-code {
			width: 100%;
			padding: 12px;
			font-size: 24px;
			font-weight: 900;
			letter-spacing: 6px;
			text-align: center;
			text-transform: uppercase;
			color: #00f7ff;
			background: rgba(255, 255, 255, 0.06);
			border: 2px solid rgba(0, 247, 255, 0.4);
			border-radius: 12px;
			margin: 14px 0 16px 0;
			outline: none;
			box-sizing: border-box;
		}
		.input-code:focus {
			border-color: #00f7ff;
			box-shadow: 0 0 16px rgba(0, 247, 255, 0.4);
		}
		.btn-primary {
			width: 100%;
			padding: 14px 20px;
			background: linear-gradient(135deg, #00f7ff, #0070f3);
			color: #000;
			font-size: 15px;
			font-weight: 800;
			border: none;
			border-radius: 999px;
			cursor: pointer;
			box-shadow: 0 4px 20px rgba(0, 247, 255, 0.4);
			transition: transform 0.1s;
		}
		.btn-primary:active {
			transform: scale(0.97);
		}

		/* Main Dashboard Layout */
		#controller-ui {
			display: grid;
			grid-template-columns: 1fr 1.2fr 1fr;
			width: 100vw;
			height: 100vh;
			padding: 12px;
			gap: 12px;
		}

		/* Left Area: Brake Pedal */
		.pedal-col {
			display: flex;
			flex-direction: column;
			height: 100%;
		}
		.touch-pedal {
			flex: 1;
			border-radius: 20px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			border: 2px solid rgba(255, 255, 255, 0.15);
			transition: transform 0.08s, box-shadow 0.08s, background 0.08s;
			position: relative;
			overflow: hidden;
		}
		.pedal-brake {
			background: linear-gradient(180deg, rgba(239, 68, 68, 0.25), rgba(185, 28, 28, 0.45));
			border-color: rgba(239, 68, 68, 0.5);
		}
		.pedal-brake.active {
			background: linear-gradient(180deg, rgba(239, 68, 68, 0.7), rgba(220, 38, 38, 0.9));
			box-shadow: 0 0 35px rgba(239, 68, 68, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.3);
			transform: scale(0.97);
		}
		.pedal-gas {
			background: linear-gradient(180deg, rgba(16, 185, 129, 0.25), rgba(5, 150, 105, 0.45));
			border-color: rgba(16, 185, 129, 0.5);
		}
		.pedal-gas.active {
			background: linear-gradient(180deg, rgba(16, 185, 129, 0.7), rgba(5, 150, 105, 0.9));
			box-shadow: 0 0 35px rgba(16, 185, 129, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.3);
			transform: scale(0.97);
		}
		.pedal-title {
			font-size: 24px;
			font-weight: 900;
			letter-spacing: 0.1em;
			text-shadow: 0 2px 10px rgba(0,0,0,0.5);
		}
		.pedal-sub {
			font-size: 11px;
			color: rgba(255, 255, 255, 0.7);
			margin-top: 4px;
			font-weight: 600;
		}

		/* Center Area: Steering Gauge & Status */
		.center-col {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: space-between;
			height: 100%;
			padding: 4px 0;
		}
		.header-status {
			display: flex;
			align-items: center;
			gap: 8px;
			background: rgba(255, 255, 255, 0.08);
			padding: 6px 16px;
			border-radius: 999px;
			border: 1px solid rgba(255, 255, 255, 0.15);
			font-size: 11px;
			font-weight: 700;
			cursor: pointer;
			transition: background 0.15s;
		}
		.header-status:active {
			background: rgba(255, 255, 255, 0.2);
		}
		.status-dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: #eab308;
			box-shadow: 0 0 8px #eab308;
		}
		.status-dot.connected {
			background: #10b981;
			box-shadow: 0 0 10px #10b981;
		}

		/* Steering Wheel Virtual Graphic */
		.wheel-container {
			position: relative;
			width: 140px;
			height: 140px;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.wheel-svg {
			width: 100%;
			height: 100%;
			transition: transform 0.05s ease-out;
			filter: drop-shadow(0 0 12px rgba(0, 247, 255, 0.4));
		}
		.steer-readout {
			position: absolute;
			font-size: 15px;
			font-weight: 800;
			color: #00f7ff;
			font-variant-numeric: tabular-nums;
		}

		/* Center Action Buttons */
		.center-actions {
			display: flex;
			gap: 8px;
			width: 100%;
		}
		.btn-action {
			flex: 1;
			padding: 10px 6px;
			border-radius: 12px;
			border: 1px solid rgba(255, 255, 255, 0.15);
			background: rgba(255, 255, 255, 0.08);
			color: #fff;
			font-size: 11px;
			font-weight: 700;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 4px;
			transition: all 0.1s;
		}
		.btn-action:active {
			background: rgba(255, 255, 255, 0.2);
			transform: scale(0.96);
		}
		.btn-nitro {
			background: linear-gradient(135deg, #ec4899, #8b5cf6);
			border-color: rgba(236, 72, 153, 0.6);
		}
		.btn-nitro.active {
			box-shadow: 0 0 20px rgba(236, 72, 153, 0.8);
			transform: scale(0.95);
		}
	</style>
</head>
<body>

	<!-- Portrait Warning -->
	<div id="portrait-warning">
		<div class="rotate-icon">📱 ➔ 🔄</div>
		<h2 style="font-size: 20px; font-weight: 800; margin-bottom: 8px;">ROTATE TO LANDSCAPE</h2>
		<p style="font-size: 13px; color: #94a3b8; max-width: 280px;">Hold your phone horizontally like a real steering wheel.</p>
	</div>

	<!-- Connect Modal Overlay -->
	<div id="permission-overlay">
		<div class="start-card">
			<div style="font-size: 36px; margin-bottom: 8px;">🏎️ 📱</div>
			<h2 style="font-size: 20px; font-weight: 800; color: #fff;">Connect to PC Game</h2>
			<p style="font-size: 12px; color: #94a3b8; margin-top: 4px;">
				Enter the 4-letter Code from your PC screen:
			</p>
			
			<input id="input-room-code" class="input-code" type="text" maxlength="6" placeholder="CODE" autofocus />
			
			<button id="btn-start-sensors" class="btn-primary">START & CONNECT 🚀</button>
		</div>
	</div>

	<!-- Main Controller Interface -->
	<div id="controller-ui">
		
		<!-- Left: Brake / Reverse Pedal -->
		<div class="pedal-col">
			<div id="pedal-brake" class="touch-pedal pedal-brake">
				<div class="pedal-title">BRAKE</div>
				<div class="pedal-sub">HOLD TO REVERSE</div>
			</div>
		</div>

		<!-- Center: Telemetry & Wheel -->
		<div class="center-col">
			
			<div class="header-status" id="btn-header-code" title="Tap to change room code">
				<span id="status-dot" class="status-dot"></span>
				<span id="status-text">CONNECTING...</span>
				<span id="ping-text" style="color: #64748b; margin-left: 2px;">--ms</span>
			</div>

			<!-- Virtual Steering Wheel SVG -->
			<div class="wheel-container">
				<svg id="steering-wheel" class="wheel-svg" viewBox="0 0 100 100">
					<!-- Outer Rim -->
					<circle cx="50" cy="50" r="42" stroke="#00f7ff" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="210 50" />
					<circle cx="50" cy="50" r="42" stroke="rgba(255,255,255,0.15)" stroke-width="6" fill="none" />
					<!-- Center Hub -->
					<circle cx="50" cy="50" r="16" fill="#0f172a" stroke="#00f7ff" stroke-width="2" />
					<!-- Top Center Marker -->
					<rect x="47" y="5" width="6" height="12" rx="3" fill="#ff007f" />
					<!-- Spokes -->
					<line x1="10" y1="50" x2="34" y2="50" stroke="#00f7ff" stroke-width="4" stroke-linecap="round" />
					<line x1="66" y1="50" x2="90" y2="50" stroke="#00f7ff" stroke-width="4" stroke-linecap="round" />
					<line x1="50" y1="66" x2="50" y2="88" stroke="#00f7ff" stroke-width="4" stroke-linecap="round" />
				</svg>
				<div id="steer-readout" class="steer-readout">0°</div>
			</div>

			<!-- Bottom Actions -->
			<div class="center-actions">
				<button id="btn-calibrate" class="btn-action">🎯 Calibrate</button>
				<button id="btn-nitro" class="btn-action btn-nitro">⚡ NITRO</button>
			</div>

		</div>

		<!-- Right: Gas / Accelerate Pedal -->
		<div class="pedal-col">
			<div id="pedal-gas" class="touch-pedal pedal-gas">
				<div class="pedal-title">GAS</div>
				<div class="pedal-sub">HOLD TO ACCELERATE</div>
			</div>
		</div>

	</div>

	<script>
		// State
		let targetRoomId = '';
		let peer = null;
		let conn = null;
		let isConnected = false;
		let sensorsActive = false;

		let zeroGamma = 0;
		let currentSteer = 0;
		let isGasActive = false;
		let isBrakeActive = false;
		let isNitroActive = false;

		const statusDot = document.getElementById('status-dot');
		const statusText = document.getElementById('status-text');
		const pingText = document.getElementById('ping-text');
		const wheelSvg = document.getElementById('steering-wheel');
		const steerReadout = document.getElementById('steer-readout');
		const pedalGas = document.getElementById('pedal-gas');
		const pedalBrake = document.getElementById('pedal-brake');
		const btnNitro = document.getElementById('btn-nitro');
		const btnCalibrate = document.getElementById('btn-calibrate');
		const permOverlay = document.getElementById('permission-overlay');
		const inputRoomCode = document.getElementById('input-room-code');
		const btnHeaderCode = document.getElementById('btn-header-code');

		// Check hash code from URL
		const hash = window.location.hash ? window.location.hash.substring(1).trim().toUpperCase() : '';
		if (hash) {
			inputRoomCode.value = hash;
			targetRoomId = hash;
		}

		// Haptic Feedback
		function vibrate(ms = 20) {
			if (navigator.vibrate) {
				try { navigator.vibrate(ms); } catch (e) {}
			}
		}

		// Touch Controls for Pedals
		function setupTouch(elem, onDown, onUp) {
			elem.addEventListener('touchstart', (e) => {
				e.preventDefault();
				onDown();
			}, { passive: false });
			elem.addEventListener('touchend', (e) => {
				e.preventDefault();
				onUp();
			}, { passive: false });
			elem.addEventListener('touchcancel', (e) => {
				e.preventDefault();
				onUp();
			}, { passive: false });

			elem.addEventListener('mousedown', () => onDown());
			elem.addEventListener('mouseup', () => onUp());
			elem.addEventListener('mouseleave', () => onUp());
		}

		setupTouch(pedalGas, () => {
			isGasActive = true;
			pedalGas.classList.add('active');
			vibrate(20);
		}, () => {
			isGasActive = false;
			pedalGas.classList.remove('active');
		});

		setupTouch(pedalBrake, () => {
			isBrakeActive = true;
			pedalBrake.classList.add('active');
			vibrate(20);
		}, () => {
			isBrakeActive = false;
			pedalBrake.classList.remove('active');
		});

		setupTouch(btnNitro, () => {
			isNitroActive = true;
			btnNitro.classList.add('active');
			vibrate(35);
		}, () => {
			isNitroActive = false;
			btnNitro.classList.remove('active');
		});

		btnCalibrate.addEventListener('click', () => {
			vibrate(30);
			btnCalibrate.textContent = '✅ Zero Set!';
			setTimeout(() => { btnCalibrate.textContent = '🎯 Calibrate'; }, 1000);
		});

		// Motion & Gyroscope Listener
		function handleOrientation(event) {
			let rawTilt = 0;
			
			if (typeof event.gamma === 'number' && event.gamma !== null) {
				if (Math.abs(window.orientation || 0) === 90) {
					rawTilt = (window.orientation === 90) ? -event.beta : event.beta;
				} else {
					rawTilt = event.gamma;
				}
			}

			const tilt = rawTilt - zeroGamma;
			const maxAngle = 38;
			const deadzone = 2.5;

			let normalized = 0;
			if (Math.abs(tilt) > deadzone) {
				const effective = Math.sign(tilt) * (Math.abs(tilt) - deadzone);
				normalized = Math.min(1, Math.max(-1, effective / (maxAngle - deadzone)));
			}

			currentSteer = normalized;

			const visualAngle = currentSteer * 90;
			wheelSvg.style.transform = `rotate(${visualAngle}deg)`;
			steerReadout.textContent = `${Math.round(currentSteer * 45)}°`;
		}

		// Request Motion Sensors
		async function activateSensors() {
			if (sensorsActive) return;
			if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
				try {
					const permission = await DeviceOrientationEvent.requestPermission();
					if (permission === 'granted') {
						window.addEventListener('deviceorientation', handleOrientation, true);
						sensorsActive = true;
					}
				} catch (e) {
					console.warn('DeviceOrientation permission error:', e);
				}
			} else {
				window.addEventListener('deviceorientation', handleOrientation, true);
				sensorsActive = true;
			}
		}

		// Start & Connect Button Handler
		document.getElementById('btn-start-sensors').addEventListener('click', async () => {
			const entered = inputRoomCode.value.trim().toUpperCase();
			if (!entered) {
				inputRoomCode.focus();
				return;
			}

			targetRoomId = entered;
			window.location.hash = targetRoomId;

			await activateSensors();
			permOverlay.style.display = 'none';

			startConnection(targetRoomId);
		});

		// Header Tap to Change Room
		btnHeaderCode.addEventListener('click', () => {
			permOverlay.style.display = 'flex';
			inputRoomCode.focus();
		});

		// WebRTC PeerJS Connection
		function startConnection(roomId) {
			if (!roomId) return;

			statusDot.className = 'status-dot';
			statusText.textContent = `JOINING ${roomId}...`;

			if (conn) {
				try { conn.close(); } catch (e) {}
				conn = null;
			}

			if (peer && !peer.destroyed) {
				connectToHost(roomId);
				return;
			}

			const peerId = 'phone_' + Math.random().toString(36).substring(2, 8);
			peer = new Peer(peerId, {
				debug: 1,
				config: {
					iceServers: [
						{ urls: 'stun:stun.l.google.com:19302' },
						{ urls: 'stun:global.stun.twilio.com:3478' }
					]
				}
			});

			peer.on('open', () => {
				connectToHost(roomId);
			});

			peer.on('error', (err) => {
				console.warn('Peer error:', err);
				statusText.textContent = `RECONNECTING...`;
				setTimeout(() => {
					if (!isConnected) startConnection(roomId);
				}, 2500);
			});
		}

		function connectToHost(roomId) {
			if (!roomId || !peer) return;

			const hostPeerId = 'realdrive_' + roomId;
			conn = peer.connect(hostPeerId, { reliable: false, serialization: 'json' });

			conn.on('open', () => {
				isConnected = true;
				statusDot.className = 'status-dot connected';
				statusText.textContent = `CONNECTED (${roomId}) 🟢`;
				vibrate([60, 40, 60]);

				startTelemetryLoop();
			});

			conn.on('close', () => {
				isConnected = false;
				statusDot.className = 'status-dot';
				statusText.textContent = `DISCONNECTED (${roomId}) 🔴`;
				setTimeout(() => {
					if (!isConnected) connectToHost(roomId);
				}, 2000);
			});

			conn.on('data', (data) => {
				if (data && data.pong) {
					const latency = Math.round(performance.now() - data.t);
					pingText.textContent = `${latency}ms`;
				}
				if (data && data.vibrate) {
					vibrate(data.vibrate);
				}
			});
		}

		function startTelemetryLoop() {
			let lastPing = 0;

			function loop() {
				if (conn && conn.open) {
					const now = performance.now();
					
					conn.send({
						s: currentSteer,
						g: isGasActive ? 1 : 0,
						b: isBrakeActive ? 1 : 0,
						n: isNitroActive ? 1 : 0,
						t: now
					});

					if (now - lastPing > 1000) {
						lastPing = now;
						conn.send({ ping: true, t: now });
					}
				}
				requestAnimationFrame(loop);
			}

			requestAnimationFrame(loop);
		}
	</script>
</body>
</html>
