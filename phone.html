<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<title>RealDrive • Mobile Controller</title>
	<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
	<style>
		* {
			box-sizing: border-box;
			user-select: none;
			-webkit-user-select: none;
			margin: 0;
			padding: 0;
			touch-action: none;
		}
		html, body {
			background: #090d16;
			color: #f0f4f8;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			width: 100vw;
			height: 100vh;
			height: 100dvh;
			overflow: hidden;
			position: fixed;
			inset: 0;
		}

		/* Orientation Warning for Portrait Mode */
		#portrait-warning {
			position: fixed;
			inset: 0;
			background: #0b1120;
			z-index: 999;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 30px;
			transition: opacity 0.3s ease;
		}
		@media (orientation: landscape) {
			#portrait-warning { display: none !important; }
		}
		.rotate-icon {
			font-size: 48px;
			margin-bottom: 12px;
			animation: rotateDevice 2s infinite ease-in-out;
		}
		@keyframes rotateDevice {
			0%, 100% { transform: rotate(0deg); }
			50% { transform: rotate(90deg); }
		}

		/* Connect Modal Overlay */
		#permission-overlay {
			position: fixed;
			inset: 0;
			background: rgba(9, 13, 22, 0.96);
			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
			z-index: 1000;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 20px;
			text-align: center;
		}
		.start-card {
			width: 380px;
			max-width: 90vw;
			background: #0f172a;
			border: 1px solid rgba(0, 247, 255, 0.3);
			border-radius: 20px;
			padding: 22px;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 247, 255, 0.15);
		}
		.input-code {
			width: 100%;
			padding: 12px;
			font-size: 24px;
			font-weight: 900;
			letter-spacing: 6px;
			text-align: center;
			text-transform: uppercase;
			color: #00f7ff;
			background: rgba(255, 255, 255, 0.06);
			border: 2px solid rgba(0, 247, 255, 0.4);
			border-radius: 12px;
			margin: 14px 0 16px 0;
			outline: none;
			box-sizing: border-box;
		}
		.input-code:focus {
			border-color: #00f7ff;
			box-shadow: 0 0 16px rgba(0, 247, 255, 0.4);
		}
		.btn-primary {
			width: 100%;
			padding: 14px 20px;
			background: linear-gradient(135deg, #00f7ff, #0070f3);
			color: #000;
			font-size: 15px;
			font-weight: 800;
			border: none;
			border-radius: 999px;
			cursor: pointer;
			box-shadow: 0 4px 20px rgba(0, 247, 255, 0.4);
			transition: transform 0.1s;
		}
		.btn-primary:active {
			transform: scale(0.97);
		}

		/* Main Dashboard Layout */
		#controller-ui {
			display: grid;
			grid-template-columns: 1fr 1fr 1fr;
			width: 100vw;
			height: 100vh;
			height: 100dvh;
			padding: 8px 12px;
			padding-bottom: max(10px, env(safe-area-inset-bottom));
			padding-top: max(8px, env(safe-area-inset-top));
			gap: 10px;
			box-sizing: border-box;
		}

		/* Left Column: Steering Controls */
		.control-col {
			display: flex;
			flex-direction: column;
			gap: 8px;
			height: 100%;
		}
		.touch-btn {
			flex: 1;
			border-radius: 18px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			border: 2px solid rgba(255, 255, 255, 0.15);
			transition: transform 0.06s, box-shadow 0.06s, background 0.06s;
			position: relative;
			overflow: hidden;
		}
		.btn-steer-left {
			background: linear-gradient(180deg, rgba(14, 165, 233, 0.25), rgba(2, 132, 199, 0.45));
			border-color: rgba(14, 165, 233, 0.5);
		}
		.btn-steer-left.active {
			background: linear-gradient(180deg, rgba(14, 165, 233, 0.75), rgba(2, 132, 199, 0.95));
			box-shadow: 0 0 35px rgba(14, 165, 233, 0.85), inset 0 0 20px rgba(255, 255, 255, 0.35);
			transform: scale(0.97);
		}
		.btn-steer-right {
			background: linear-gradient(180deg, rgba(99, 102, 241, 0.25), rgba(79, 70, 229, 0.45));
			border-color: rgba(99, 102, 241, 0.5);
		}
		.btn-steer-right.active {
			background: linear-gradient(180deg, rgba(99, 102, 241, 0.75), rgba(79, 70, 229, 0.95));
			box-shadow: 0 0 35px rgba(99, 102, 241, 0.85), inset 0 0 20px rgba(255, 255, 255, 0.35);
			transform: scale(0.97);
		}
		.btn-pedal-brake {
			background: linear-gradient(180deg, rgba(239, 68, 68, 0.25), rgba(185, 28, 28, 0.45));
			border-color: rgba(239, 68, 68, 0.5);
		}
		.btn-pedal-brake.active {
			background: linear-gradient(180deg, rgba(239, 68, 68, 0.75), rgba(220, 38, 38, 0.95));
			box-shadow: 0 0 35px rgba(239, 68, 68, 0.85), inset 0 0 20px rgba(255, 255, 255, 0.35);
			transform: scale(0.97);
		}
		.btn-pedal-gas {
			background: linear-gradient(180deg, rgba(16, 185, 129, 0.25), rgba(5, 150, 105, 0.45));
			border-color: rgba(16, 185, 129, 0.5);
		}
		.btn-pedal-gas.active {
			background: linear-gradient(180deg, rgba(16, 185, 129, 0.75), rgba(5, 150, 105, 0.95));
			box-shadow: 0 0 35px rgba(16, 185, 129, 0.85), inset 0 0 20px rgba(255, 255, 255, 0.35);
			transform: scale(0.97);
		}
		.btn-label {
			font-size: 20px;
			font-weight: 900;
			letter-spacing: 0.05em;
			text-shadow: 0 2px 10px rgba(0,0,0,0.5);
		}
		.btn-sub {
			font-size: 10px;
			color: rgba(255, 255, 255, 0.7);
			margin-top: 2px;
			font-weight: 600;
		}

		/* Center Area: Steering Gauge & Status */
		.center-col {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: space-between;
			height: 100%;
			padding: 2px 0;
			box-sizing: border-box;
		}
		.header-row {
			display: flex;
			align-items: center;
			gap: 6px;
		}
		.header-status {
			display: flex;
			align-items: center;
			gap: 6px;
			background: rgba(255, 255, 255, 0.08);
			padding: 5px 12px;
			border-radius: 999px;
			border: 1px solid rgba(255, 255, 255, 0.15);
			font-size: 11px;
			font-weight: 700;
			cursor: pointer;
		}
		.btn-fullscreen {
			background: rgba(255, 255, 255, 0.08);
			border: 1px solid rgba(255, 255, 255, 0.15);
			color: #00f7ff;
			padding: 5px 10px;
			border-radius: 999px;
			font-size: 12px;
			font-weight: 700;
			cursor: pointer;
		}
		.status-dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: #eab308;
			box-shadow: 0 0 8px #eab308;
		}
		.status-dot.connected {
			background: #10b981;
			box-shadow: 0 0 10px #10b981;
		}

		/* Mode Switcher Pill */
		.mode-switcher {
			display: flex;
			background: rgba(0, 0, 0, 0.4);
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 999px;
			padding: 2px;
			gap: 2px;
			width: 100%;
			max-width: 180px;
		}
		.mode-btn {
			flex: 1;
			padding: 5px 0;
			text-align: center;
			font-size: 10px;
			font-weight: 800;
			border-radius: 999px;
			border: none;
			background: transparent;
			color: #94a3b8;
			cursor: pointer;
			transition: all 0.15s;
		}
		.mode-btn.active {
			background: #00f7ff;
			color: #000;
			box-shadow: 0 0 10px rgba(0, 247, 255, 0.4);
		}

		/* Center Action Buttons */
		.center-actions {
			display: flex;
			gap: 6px;
			width: 100%;
		}
		.btn-action {
			flex: 1;
			padding: 10px 4px;
			border-radius: 12px;
			border: 1px solid rgba(255, 255, 255, 0.15);
			background: rgba(255, 255, 255, 0.08);
			color: #fff;
			font-size: 11px;
			font-weight: 700;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 4px;
			transition: all 0.1s;
		}
		.btn-action:active {
			background: rgba(255, 255, 255, 0.2);
			transform: scale(0.96);
		}
		.btn-nitro {
			background: linear-gradient(135deg, #ec4899, #8b5cf6);
			border-color: rgba(236, 72, 153, 0.6);
		}
		.btn-nitro.active {
			box-shadow: 0 0 20px rgba(236, 72, 153, 0.8);
			transform: scale(0.95);
		}
	</style>
</head>
<body>

	<!-- Portrait Warning -->
	<div id="portrait-warning">
		<div class="rotate-icon">📱 ➔ 🔄</div>
		<h2 style="font-size: 20px; font-weight: 800; margin-bottom: 8px;">ROTATE TO LANDSCAPE</h2>
		<p style="font-size: 13px; color: #94a3b8; max-width: 280px;">Hold your phone horizontally like a game controller.</p>
	</div>

	<!-- Connect Modal Overlay -->
	<div id="permission-overlay">
		<div class="start-card">
			<div style="font-size: 36px; margin-bottom: 8px;">🎮 📱</div>
			<h2 style="font-size: 20px; font-weight: 800; color: #fff;">Connect to PC Game</h2>
			<p style="font-size: 12px; color: #94a3b8; margin-top: 4px;">
				Enter the 4-letter Code from your PC screen:
			</p>
			
			<input id="input-room-code" class="input-code" type="text" maxlength="6" placeholder="CODE" autofocus />
			
			<button id="btn-start-sensors" class="btn-primary">START & CONNECT 🚀</button>
		</div>
	</div>

	<!-- Main Controller Interface -->
	<div id="controller-ui">
		
		<!-- Left: Steer Left & Steer Right Buttons -->
		<div class="control-col">
			<div id="btn-steer-left" class="touch-btn btn-steer-left">
				<div class="btn-label">⬅️ LEFT</div>
				<div class="btn-sub">STEER LEFT</div>
			</div>
			<div id="btn-steer-right" class="touch-btn btn-steer-right">
				<div class="btn-label">RIGHT ➡️</div>
				<div class="btn-sub">STEER RIGHT</div>
			</div>
		</div>

		<!-- Center: Mode, Status, & Nitro -->
		<div class="center-col">
			
			<div class="header-row">
				<div class="header-status" id="btn-header-code" title="Tap to change room code">
					<span id="status-dot" class="status-dot"></span>
					<span id="status-text">CONNECTING...</span>
					<span id="ping-text" style="color: #64748b; margin-left: 2px;">--ms</span>
				</div>
				<button id="btn-fs-toggle" class="btn-fullscreen" title="Toggle Fullscreen">⛶</button>
			</div>

			<!-- Control Mode Switcher -->
			<div class="mode-switcher">
				<button id="mode-buttons" class="mode-btn active">🎮 4-BUTTONS</button>
				<button id="mode-gyro" class="mode-btn">🌀 GYRO</button>
			</div>

			<!-- Center Display (Live Steer Feedback) -->
			<div style="text-align: center;">
				<div id="steer-indicator-text" style="font-size: 14px; font-weight: 800; color: #00f7ff;">STEER: 0%</div>
				<div style="width: 100px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 999px; margin: 4px auto; overflow: hidden; position: relative;">
					<div id="steer-bar" style="position: absolute; top: 0; bottom: 0; left: 50%; width: 0; background: #00f7ff; transition: width 0.05s, left 0.05s;"></div>
				</div>
			</div>

			<!-- Bottom Actions -->
			<div class="center-actions">
				<button id="btn-calibrate" class="btn-action" style="display: none;">🎯 Zero</button>
				<button id="btn-nitro" class="btn-action btn-nitro">⚡ NITRO</button>
			</div>

		</div>

		<!-- Right: Gas & Brake Pedals -->
		<div class="control-col">
			<div id="btn-gas" class="touch-btn btn-pedal-gas">
				<div class="btn-label">⬆️ GAS</div>
				<div class="btn-sub">ACCELERATE</div>
			</div>
			<div id="btn-brake" class="touch-btn btn-pedal-brake">
				<div class="btn-label">⬇️ BRAKE</div>
				<div class="btn-sub">REVERSE</div>
			</div>
		</div>

	</div>

	<script>
		// State
		let targetRoomId = '';
		let controlMode = localStorage.getItem('realdrive.ctrl_mode') || 'buttons'; // 'buttons' or 'gyro'
		let isConnected = false;
		let localWs = null;
		let mqttClient = null;

		let btnLeftActive = false;
		let btnRightActive = false;
		let isGasActive = false;
		let isBrakeActive = false;
		let isNitroActive = false;

		let currentSteer = 0;
		let zeroGamma = 0;

		const statusDot = document.getElementById('status-dot');
		const statusText = document.getElementById('status-text');
		const pingText = document.getElementById('ping-text');
		const steerText = document.getElementById('steer-indicator-text');
		const steerBar = document.getElementById('steer-bar');

		const btnSteerLeft = document.getElementById('btn-steer-left');
		const btnSteerRight = document.getElementById('btn-steer-right');
		const btnGas = document.getElementById('btn-gas');
		const btnBrake = document.getElementById('btn-brake');
		const btnNitro = document.getElementById('btn-nitro');
		const btnCalibrate = document.getElementById('btn-calibrate');

		const modeButtons = document.getElementById('mode-buttons');
		const modeGyro = document.getElementById('mode-gyro');
		const permOverlay = document.getElementById('permission-overlay');
		const inputRoomCode = document.getElementById('input-room-code');
		const btnHeaderCode = document.getElementById('btn-header-code');
		const btnFsToggle = document.getElementById('btn-fs-toggle');

		// Set Initial Mode
		function setMode(mode) {
			controlMode = mode;
			localStorage.setItem('realdrive.ctrl_mode', mode);
			modeButtons.classList.toggle('active', mode === 'buttons');
			modeGyro.classList.toggle('active', mode === 'gyro');
			btnCalibrate.style.display = mode === 'gyro' ? 'flex' : 'none';

			if (mode === 'gyro') {
				activateGyroSensors();
			}
		}

		modeButtons.addEventListener('click', () => setMode('buttons'));
		modeGyro.addEventListener('click', () => setMode('gyro'));
		setMode(controlMode);

		// Fullscreen helper
		function enterFullscreen() {
			const doc = document.documentElement;
			if (doc.requestFullscreen) doc.requestFullscreen().catch(() => {});
			else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
		}
		btnFsToggle.addEventListener('click', enterFullscreen);

		// Hash code auto-fill
		const hash = window.location.hash ? window.location.hash.substring(1).trim().toUpperCase() : '';
		if (hash) {
			inputRoomCode.value = hash;
			targetRoomId = hash;
		}

		// Haptic Feedback
		function vibrate(ms = 20) {
			if (navigator.vibrate) {
				try { navigator.vibrate(ms); } catch (e) {}
			}
		}

		// Pointer/Touch Listeners for Instant Multi-Touch Response
		function bindButton(elem, onDown, onUp) {
			elem.addEventListener('pointerdown', (e) => {
				e.preventDefault();
				elem.setPointerCapture(e.pointerId);
				onDown();
			}, { passive: false });

			elem.addEventListener('pointerup', (e) => {
				e.preventDefault();
				onUp();
			}, { passive: false });

			elem.addEventListener('pointercancel', (e) => {
				e.preventDefault();
				onUp();
			}, { passive: false });
		}

		bindButton(btnSteerLeft, () => {
			btnLeftActive = true;
			btnSteerLeft.classList.add('active');
			vibrate(15);
		}, () => {
			btnLeftActive = false;
			btnSteerLeft.classList.remove('active');
		});

		bindButton(btnSteerRight, () => {
			btnRightActive = true;
			btnSteerRight.classList.add('active');
			vibrate(15);
		}, () => {
			btnRightActive = false;
			btnSteerRight.classList.remove('active');
		});

		bindButton(btnGas, () => {
			isGasActive = true;
			btnGas.classList.add('active');
			vibrate(15);
		}, () => {
			isGasActive = false;
			btnGas.classList.remove('active');
		});

		bindButton(btnBrake, () => {
			isBrakeActive = true;
			btnBrake.classList.add('active');
			vibrate(15);
		}, () => {
			isBrakeActive = false;
			btnBrake.classList.remove('active');
		});

		bindButton(btnNitro, () => {
			isNitroActive = true;
			btnNitro.classList.add('active');
			vibrate(30);
		}, () => {
			isNitroActive = false;
			btnNitro.classList.remove('active');
		});

		btnCalibrate.addEventListener('click', () => {
			zeroGamma = 0;
			vibrate(30);
		});

		// Gyroscope Handler
		function handleOrientation(event) {
			if (controlMode !== 'gyro') return;
			let rawTilt = 0;
			if (typeof event.gamma === 'number' && event.gamma !== null) {
				if (Math.abs(window.orientation || 0) === 90) {
					rawTilt = (window.orientation === 90) ? -event.beta : event.beta;
				} else {
					rawTilt = event.gamma;
				}
			}

			const tilt = rawTilt - zeroGamma;
			const maxAngle = 35;
			const deadzone = 2.5;

			let normalized = 0;
			if (Math.abs(tilt) > deadzone) {
				const effective = Math.sign(tilt) * (Math.abs(tilt) - deadzone);
				normalized = Math.min(1, Math.max(-1, effective / (maxAngle - deadzone)));
			}
			currentSteer = normalized;
		}

		async function activateGyroSensors() {
			if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
				try {
					const perm = await DeviceOrientationEvent.requestPermission();
					if (perm === 'granted') {
						window.addEventListener('deviceorientation', handleOrientation, true);
					}
				} catch (e) {}
			} else {
				window.addEventListener('deviceorientation', handleOrientation, true);
			}
		}

		// Connect Button
		document.getElementById('btn-start-sensors').addEventListener('click', () => {
			const entered = inputRoomCode.value.trim().toUpperCase();
			if (!entered) {
				inputRoomCode.focus();
				return;
			}
			enterFullscreen();
			targetRoomId = entered;
			window.location.hash = targetRoomId;
			permOverlay.style.display = 'none';

			startConnection(targetRoomId);
		});

		btnHeaderCode.addEventListener('click', () => {
			permOverlay.style.display = 'flex';
			inputRoomCode.focus();
		});

		// Dual-Mode Connection (Same Wi-Fi Direct WebSocket + Online MQTT)
		let broadcast = null;
		let streamInterval = null;

		function startConnection(roomId) {
			if (!roomId) return;
			roomId = roomId.toUpperCase().trim();

			statusDot.className = 'status-dot';
			statusText.textContent = `CONNECTING...`;

			if (typeof BroadcastChannel !== 'undefined') {
				broadcast = new BroadcastChannel('realdrive_channel_' + roomId);
			}

			// 1. Check if running on local Wi-Fi direct server
			if (window.location.protocol.startsWith('http') && window.location.hostname !== 'adhi2k.github.io') {
				const wsUrl = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws';
				try {
					localWs = new WebSocket(wsUrl);
					localWs.onopen = () => {
						localWs.send(JSON.stringify({ type: 'join', role: 'phone', room: roomId }));
					};
					localWs.onmessage = (e) => {
						try {
							const msg = JSON.parse(e.data);
							if (msg.type === 'status') {
								isConnected = msg.connected;
								statusDot.className = isConnected ? 'status-dot connected' : 'status-dot';
								statusText.textContent = isConnected ? `LOCAL WI-FI (${roomId}) 🟢` : `WAITING PC...`;
								pingText.textContent = '1ms';
								if (isConnected) vibrate([50, 30, 50]);
							}
							if (msg.vibrate) vibrate(msg.vibrate);
						} catch (err) {}
					};
				} catch (e) {}
			}

			// 2. Online High-Speed WebSocket Broker
			const topic = `realdrive/game/${roomId}`;
			const feedbackTopic = `realdrive/game/${roomId}/feedback`;
			const pongTopic = `realdrive/game/${roomId}/pong`;

			if (mqttClient) {
				try { mqttClient.end(true); } catch (e) {}
			}

			try {
				mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
					clientId: 'ph_' + Math.random().toString(16).substring(2, 8),
					clean: true,
					keepalive: 30,
					reconnectPeriod: 1500
				});

				mqttClient.on('connect', () => {
					isConnected = true;
					statusDot.className = 'status-dot connected';
					statusText.textContent = `CONNECTED (${roomId}) 🟢`;
					vibrate([60, 40, 60]);

					mqttClient.subscribe(feedbackTopic, { qos: 0 });
					mqttClient.subscribe(pongTopic, { qos: 0 });
				});

				mqttClient.on('message', (t, msg) => {
					try {
						const data = JSON.parse(msg.toString());
						if (data && data.vibrate) vibrate(data.vibrate);
						if (data && data.t) {
							const lat = Math.round(performance.now() - data.t);
							pingText.textContent = `${lat}ms`;
						}
					} catch (e) {}
				});

				mqttClient.on('error', () => {
					statusDot.className = 'status-dot';
					statusText.textContent = `RETRYING...`;
				});
			} catch (e) {}

			// Start 40Hz Telemetry Stream
			if (streamInterval) clearInterval(streamInterval);

			let lastPing = 0;
			streamInterval = setInterval(() => {
				const now = performance.now();

				// Calculate Steer from Buttons or Gyro
				if (controlMode === 'buttons') {
					if (btnLeftActive && !btnRightActive) {
						currentSteer = -1.0;
					} else if (btnRightActive && !btnLeftActive) {
						currentSteer = 1.0;
					} else {
						currentSteer = 0.0;
					}
				}

				// Update UI Steer Bar
				const steerPct = Math.round(currentSteer * 100);
				steerText.textContent = `STEER: ${steerPct}%`;
				if (steerPct >= 0) {
					steerBar.style.left = '50%';
					steerBar.style.width = `${steerPct / 2}%`;
				} else {
					steerBar.style.left = `${50 + (steerPct / 2)}%`;
					steerBar.style.width = `${Math.abs(steerPct) / 2}%`;
				}

				const packet = {
					s: currentSteer,
					g: isGasActive ? 1 : 0,
					b: isBrakeActive ? 1 : 0,
					n: isNitroActive ? 1 : 0,
					t: now
				};

				// Send via Local Wi-Fi WS
				if (localWs && localWs.readyState === 1) {
					localWs.send(JSON.stringify(packet));
				}

				// Send via Online MQTT
				if (mqttClient && mqttClient.connected) {
					mqttClient.publish(topic, JSON.stringify(packet), { qos: 0 });

					if (now - lastPing > 1000) {
						lastPing = now;
						mqttClient.publish(topic + '/ping', JSON.stringify({ t: now }), { qos: 0 });
					}
				}

				if (broadcast) {
					broadcast.postMessage(packet);
				}
			}, 25);
		}
	</script>
</body>
